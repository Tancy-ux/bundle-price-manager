# Refresh Shopify stock levels on a schedule and write them to the live data.
#
# Safe to run unattended: the script only ever updates the stock fields on
# products that already exist (matched by SKU) — it never adds/removes
# products, bundles, or touches prices.
#
# Requires these repository secrets (Settings > Secrets and variables > Actions):
#   KV_REST_API_URL        \ same values as sync-store.yml /
#   KV_REST_API_TOKEN      / (Upstash REST URL + token)
#   SHOPIFY_STORE          e.g. your-store.myshopify.com
#   SHOPIFY_ADMIN_TOKEN    custom app Admin API token, scopes:
#                          read_products + read_inventory

name: Fetch Shopify stock

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch: {}

jobs:
  fetch-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Fetch and apply stock levels
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
        run: node scripts/fetch-stock.js --apply | tee stock-output.txt

      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo '### Stock refresh report'
            echo '```'
            cat stock-output.txt 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
